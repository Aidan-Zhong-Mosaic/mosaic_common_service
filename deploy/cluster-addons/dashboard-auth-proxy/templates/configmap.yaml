apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dashboard-auth-proxy.fullname" . }}
  labels:
    {{- include "dashboard-auth-proxy.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen {{ .Values.port }};

        location / {
            auth_basic "Kubernetes Dashboard";
            auth_basic_user_file /etc/nginx/auth/.htpasswd;

            proxy_pass {{ .Values.upstream.scheme }}://{{ .Values.upstream.host }}:{{ .Values.upstream.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Dashboard's own websocket-backed terminal (exec) and log
            # streaming need the Upgrade/Connection headers passed through.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            {{- if not .Values.upstream.sslVerify }}
            # Dashboard serves HTTPS with a self-signed cert by default -
            # this is internal cluster traffic (proxy pod -> dashboard pod),
            # not the public edge, so skipping verification here is fine.
            proxy_ssl_verify off;
            {{- end }}
        }
    }
