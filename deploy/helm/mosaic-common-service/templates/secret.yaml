{{/*
Only rendered for the dev/quick-start path (redshiftCredentials.create: true).
In real environments, pre-create the Secret out-of-band and set
redshiftCredentials.existingSecret instead - see README-deploy.md.
*/}}
{{- if and .Values.redshiftCredentials.create (not .Values.redshiftCredentials.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mosaic-common-service.credentialsSecretName" . }}
  labels:
    {{- include "mosaic-common-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  credentials.json: |-
    {{ dict "username" .Values.redshiftCredentials.username "password" .Values.redshiftCredentials.password | toJson }}
{{- end }}
